services:
  db:
    image: postgres:16
    container_name: codeforces_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cf_user
      POSTGRES_PASSWORD: cf_password
      POSTGRES_DB: codeforces
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: codeforces_app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: